name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug APK et publier une Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configuration Java (requis par Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3

      - name: Installation des dependances
        run: npm install

      - name: Build web statique (Next.js export)
        run: npm run build
        env:
          BUILD_TARGET: capacitor
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Ajout de la plateforme Android (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Rendre gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build de l'APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK avec le numero de run
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             dist/MyOldSharedCalendar-debug-${{ github.run_number }}.apk

      - name: Publication de l'APK en artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyOldSharedCalendar-debug-apk
          path: dist/MyOldSharedCalendar-debug-${{ github.run_number }}.apk
          retention-days: 30

      - name: Creation de la Release GitHub avec l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build APK #${{ github.run_number }}"
          body: |
            APK genere automatiquement depuis le commit ${{ github.sha }}.
            Build debug, a installer manuellement sur Android (source inconnue autorisee).
          files: dist/MyOldSharedCalendar-debug-${{ github.run_number }}.apk
          draft: false
          prerelease: true
