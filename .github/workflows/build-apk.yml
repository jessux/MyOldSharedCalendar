name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK et publier une Release
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout du code (historique complet pour le changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Configuration Java (requis par Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3

      - name: Installation des dependances
        run: npm install

      - name: Verification des variables Supabase (debug)
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL est VIDE dans ce build CI"
            exit 1
          else
            echo "NEXT_PUBLIC_SUPABASE_URL est present (longueur: ${#NEXT_PUBLIC_SUPABASE_URL})"
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY est VIDE dans ce build CI"
            exit 1
          else
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY est present (longueur: ${#NEXT_PUBLIC_SUPABASE_ANON_KEY})"
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Calcul du numero de version (semver simplifie)
        id: version
        run: |
          MAJOR=1
          MINOR=0
          PATCH=${{ github.run_number }}
          VERSION_CODE=${{ github.run_number }}
          echo "version=v${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "semver=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Build web statique (Next.js export)
        run: npm run build
        env:
          BUILD_TARGET: capacitor
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.semver }}

      - name: Ajout de la plateforme Android (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configurer la signature et les permissions Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Le secret $variable est manquant"
              exit 1
            fi
          done

          KEYSTORE_FILE="$RUNNER_TEMP/myoldsharedcalendar-release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"

          sed -i -E "s/versionCode [0-9]+/versionCode ${{ steps.version.outputs.version_code }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${{ steps.version.outputs.semver }}\"/" android/app/build.gradle

          if ! grep -q "android.permission.REQUEST_INSTALL_PACKAGES" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/i\    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' android/app/src/main/AndroidManifest.xml
          fi

          cat >> android/app/build.gradle <<'EOF'

          android {
            signingConfigs {
              release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF

      - name: Rendre gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build de l'APK release signee
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/myoldsharedcalendar-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Renommer l'APK avec la version
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/MyOldSharedCalendar-${{ steps.version.outputs.version }}.apk"

      - name: Generer le changelog depuis le dernier tag
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "log<<EOF" >> "$GITHUB_OUTPUT"
            git log --pretty=format:"- %s (%h)" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "log<<EOF" >> "$GITHUB_OUTPUT"
            git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Calcul du checksum SHA-256 de l'APK
        run: |
          cd dist
          sha256sum "MyOldSharedCalendar-${{ steps.version.outputs.version }}.apk" > checksums.txt
          cat checksums.txt

      - name: Publication de l'APK en artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyOldSharedCalendar-${{ steps.version.outputs.version }}
          path: |
            dist/MyOldSharedCalendar-${{ steps.version.outputs.version }}.apk
            dist/checksums.txt
          retention-days: 90

      - name: Creation de la Release GitHub avec l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "MyOldSharedCalendar ${{ steps.version.outputs.version }}"
          body: |
            ## Changements

            ${{ steps.changelog.outputs.log }}

            ---
            Build automatique depuis le commit ${{ github.sha }}.
            APK release signee. Verifiee automatiquement (checksum SHA-256) et proposee via la mise a jour dans l'application.
          files: |
            dist/MyOldSharedCalendar-${{ steps.version.outputs.version }}.apk
            dist/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: false
