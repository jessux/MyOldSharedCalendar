name: Build Android APK

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK et publier une Release
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout du code (historique complet pour le changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Configuration Java (requis par Gradle/Android)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3

      - name: Installation des dependances
        run: |
          npm install -g npm@latest
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci a echoue (tentative $i/3), nouvel essai..."
            sleep 5
          done
          exit 1

      - name: Verification des variables Supabase (debug)
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL est VIDE dans ce build CI"
            exit 1
          else
            echo "NEXT_PUBLIC_SUPABASE_URL est present (longueur: ${#NEXT_PUBLIC_SUPABASE_URL})"
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY est VIDE dans ce build CI"
            exit 1
          else
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY est present (longueur: ${#NEXT_PUBLIC_SUPABASE_ANON_KEY})"
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Calcul du numero de version depuis le tag git
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Le tag '$TAG' ne respecte pas le format vX.Y.Z"
              exit 1
            fi
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
            echo "semver=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            # Declenchement manuel (workflow_dispatch) sans tag : build de
            # verification uniquement, aucune Release GitHub n'est publiee.
            echo "version=v0.0.0-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "semver=0.0.0-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build web statique (Next.js export)
        run: npm run build
        env:
          BUILD_TARGET: capacitor
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.semver }}

      - name: Ajout de la plateforme Android (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generation des icones et splash screens Android
        run: npx @capacitor/assets generate --android

      - name: Configurer la signature et les permissions Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Le secret $variable est manquant"
              exit 1
            fi
          done

          KEYSTORE_FILE="$RUNNER_TEMP/myoldsharedcalendar-release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"

          sed -i -E "s/versionCode [0-9]+/versionCode ${{ steps.version.outputs.version_code }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${{ steps.version.outputs.semver }}\"/" android/app/build.gradle

          if ! grep -q "android.permission.REQUEST_INSTALL_PACKAGES" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/i\    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' android/app/src/main/AndroidManifest.xml
          fi

          # Intent-filter pour le deep link de retour OAuth Google (voir
          # NATIVE_AUTH_REDIRECT_URL dans src/hooks/useAuth.ts) : Google refuse
          # de s'authentifier depuis la WebView de l'app, on passe donc par le
          # navigateur systeme (@capacitor/browser) puis on revient via ce schema.
          if ! grep -q 'android:scheme="fr.kahlouche.myoldsharedcalendar"' android/app/src/main/AndroidManifest.xml; then
            awk '
              /<\/intent-filter>/ && !done {
                print
                print "    <intent-filter>"
                print "        <action android:name=\"android.intent.action.VIEW\" />"
                print "        <category android:name=\"android.intent.category.DEFAULT\" />"
                print "        <category android:name=\"android.intent.category.BROWSABLE\" />"
                print "        <data android:scheme=\"fr.kahlouche.myoldsharedcalendar\" android:host=\"auth-callback\" />"
                print "    </intent-filter>"
                done=1
                next
              }
              { print }
            ' android/app/src/main/AndroidManifest.xml > android/app/src/main/AndroidManifest.xml.tmp
            mv android/app/src/main/AndroidManifest.xml.tmp android/app/src/main/AndroidManifest.xml
          fi

          cat >> android/app/build.gradle <<'EOF'

          repositories {
            flatDir {
              dirs '../../node_modules/@capacitor/background-runner/android/src/main/libs'
            }
          }
          EOF

          cat >> android/app/build.gradle <<'EOF'

          android {
            signingConfigs {
              release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF

      - name: Rendre gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build de l'APK release signee
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/myoldsharedcalendar-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Renommer l'APK avec la version
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/MyOldSharedCalendar-${{ steps.version.outputs.version }}.apk"

      - name: Generer le changelog depuis le dernier tag
        id: changelog
        if: steps.version.outputs.is_release == 'true'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "log<<EOF" >> "$GITHUB_OUTPUT"
            git log --pretty=format:"- %s (%h)" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "log<<EOF" >> "$GITHUB_OUTPUT"
            git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Calcul du checksum SHA-256 de l'APK
        run: |
          cd dist
          sha256sum "MyOldSharedCalendar-${{ steps.version.outputs.version }}.apk" > checksums.txt
          cat checksums.txt

      - name: Publication de l'APK en artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyOldSharedCalendar-${{ steps.version.outputs.version }}
          path: |
            dist/MyOldSharedCalendar-${{ steps.version.outputs.version }}.apk
            dist/checksums.txt
          retention-days: 90

      - name: Creation de la Release GitHub avec l'APK
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "MyOldSharedCalendar ${{ steps.version.outputs.version }}"
          body: |
            ## Changements

            ${{ steps.changelog.outputs.log }}

            ---
            Build automatique depuis le commit ${{ github.sha }}.
            APK release signee. Verifiee automatiquement (checksum SHA-256) et proposee via la mise a jour dans l'application.
          files: |
            dist/MyOldSharedCalendar-${{ steps.version.outputs.version }}.apk
            dist/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: false
