name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK et publier une Release
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout du code (historique complet pour le changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configuration Java (requis par Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3

      - name: Installation des dependances
        run: npm install

      - name: Verification des variables Supabase (debug)
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL est VIDE dans ce build CI"
            exit 1
          else
            echo "NEXT_PUBLIC_SUPABASE_URL est present (longueur: ${#NEXT_PUBLIC_SUPABASE_URL})"
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY est VIDE dans ce build CI"
            exit 1
          else
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY est present (longueur: ${#NEXT_PUBLIC_SUPABASE_ANON_KEY})"
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build web statique (Next.js export)
        run: npm run build
        env:
          BUILD_TARGET: capacitor
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Ajout de la plateforme Android (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Rendre gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build de l'APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Calcul du numero de version (semver simplifie)
        id: version
        run: |
          MAJOR=1
          MINOR=0
          PATCH=${{ github.run_number }}
          echo "version=v${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Renommer l'APK avec la version
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/MyOldSharedCalendar-${{ steps.version.outputs.version }}.apk"

      - name: Generer le changelog depuis le dernier tag
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "log<<EOF" >> "$GITHUB_OUTPUT"
            git log --pretty=format:"- %s (%h)" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "log<<EOF" >> "$GITHUB_OUTPUT"
            git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Publication de l'APK en artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyOldSharedCalendar-${{ steps.version.outputs.version }}
          path: dist/MyOldSharedCalendar-${{ steps.version.outputs.version }}.apk
          retention-days: 90

      - name: Creation de la Release GitHub avec l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "MyOldSharedCalendar ${{ steps.version.outputs.version }}"
          body: |
            ## Changements

            ${{ steps.changelog.outputs.log }}

            ---
            Build automatique depuis le commit ${{ github.sha }}.
            APK debug, a installer manuellement (autoriser les sources inconnues sur Android).
          files: dist/MyOldSharedCalendar-${{ steps.version.outputs.version }}.apk
          draft: false
          prerelease: false
          generate_release_notes: false
